<!DOCTYPE html>
<html>

<head>

  <base target="_top">


  <style>

     {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
    }


    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: linear-gradient(180deg, #4f46e5, #3730a3);
      color: white;
      padding: 25px 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      background: white;
      color: #4f46e5;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 23px;
      font-weight: bold;
    }

    .logo h2 {
      font-size: 19px;
    }

    .menu-title {
      font-size: 11px;
      text-transform: uppercase;
      opacity: .7;
      margin: 20px 10px 10px;
    }

    .menu {
      padding: 14px 15px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: .2s;
    }

    .menu:hover,
    .menu.active {
      background: rgba(255,255,255,.18);
    }


    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 28px;
      color: #111827;
    }

    .topbar p {
      color: #6b7280;
      margin-top: 5px;
    }

    .profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #e0e7ff;
      color: #4338ca;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }


    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .card-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 27px;
      font-weight: bold;
      color: #111827;
    }

    .icon {
      width: 42px;
      height: 42px;
      background: #eef2ff;
      color: #4f46e5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 15px;
    }


    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 22px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .panel h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }


    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      margin-bottom: 16px;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,.1);
    }

    .btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      background: #3730a3;
      transform: translateY(-1px);
    }


    .search {
      margin-bottom: 15px;
    }


    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      background: #f9fafb;
      padding: 13px;
      font-size: 12px;
      color: #6b7280;
    }

    td {
      padding: 14px 13px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }

    .category {
      background: #eef2ff;
      color: #4338ca;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .amount {
      font-weight: bold;
      color: #dc2626;
    }

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #fecaca;
    }


    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #9ca3af;
    }


    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .loader {
      width: 45px;
      height: 45px;
      border: 4px solid #ddd;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    @media(max-width: 1000px) {

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

    }

    @media(max-width: 700px) {

      .sidebar {
        width: 70px;
        padding: 20px 10px;
      }

      .logo h2,
      .menu span,
      .menu-title {
        display: none;
      }

      .logo {
        justify-content: center;
      }

      .main {
        margin-left: 70px;
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="loader"></div>
  </div>



  <aside class="sidebar">

    <div class="logo">

      <div class="logo-icon">
        ₱
      </div>

      <h2>Expense Tracker</h2>

    </div>


    <div class="menu-title">
      Menu
    </div>


    <div class="menu active">
      📊 <span>Dashboard</span>
    </div>

    <div class="menu" onclick="focusExpenseForm()">
      ➕ <span>Add Expense</span>
    </div>

    <div class="menu" onclick="scrollToExpenses()">
      📋 <span>Expenses</span>
    </div>

  </aside>



  <main class="main">

    <div class="topbar">

      <div>
        <h1>Dashboard</h1>
        <p>Track and manage your daily expenses.</p>
      </div>

      <div class="profile">
        ET
      </div>

    </div>




    <section class="cards">

      <div class="card">

        <div class="icon">
          ₱
        </div>

        <div class="card-title">
          Total Expenses
        </div>

        <div class="card-value" id="total">
          ₱0.00
        </div>

      </div>


      <div class="card">

        <div class="icon">
          📅
        </div>

        <div class="card-title">
          Today's Expenses
        </div>

        <div class="card-value" id="today">
          ₱0.00
        </div>

      </div>


      <div class="card">

        <div class="icon">
          📋
        </div>

        <div class="card-title">
          Total Records
        </div>

        <div class="card-value" id="count">
          0
        </div>

      </div>


      <div class="card">

        <div class="icon">
          📈
        </div>

        <div class="card-title">
          Average Expense
        </div>

        <div class="card-value" id="average">
          ₱0.00
        </div>

      </div>

    </section>



    <section class="content-grid">


      <!-- ADD EXPENSE -->

      <div class="panel" id="expenseForm">

        <h2>Add Expense</h2>


        <label>
          Description
        </label>

        <input
          type="text"
          id="description"
          placeholder="Example: Lunch"
        >


        <label>
          Category
        </label>

        <select id="category">

          <option value="">
            Select category
          </option>

          <option value="Food">
            🍔 Food
          </option>

          <option value="Transportation">
            🚌 Transportation
          </option>

          <option value="School">
            📚 School
          </option>

          <option value="Bills">
            💡 Bills
          </option>

          <option value="Shopping">
            🛍️ Shopping
          </option>

          <option value="Entertainment">
            🎮 Entertainment
          </option>

          <option value="Other">
            📦 Other
          </option>

        </select>


        <label>
          Amount
        </label>

        <input
          type="number"
          id="amount"
          placeholder="₱ 0.00"
          min="0"
          step="0.01"
        >


        <label>
          Date
        </label>

        <input
          type="date"
          id="date"
        >


        <button
          class="btn"
          onclick="addExpense()"
        >
          + Add Expense
        </button>

      </div>




      <div class="panel" id="expensesPanel">

        <h2>Recent Expenses</h2>


        <input
          class="search"
          type="text"
          id="search"
          placeholder="🔍 Search expense..."
          onkeyup="searchExpenses()"
        >


        <div class="table-container">

          <table>

            <thead>

              <tr>

                <th>
                  Description
                </th>

                <th>
                  Category
                </th>

                <th>
                  Amount
                </th>

                <th>
                  Date
                </th>

                <th>
                  Action
                </th>

              </tr>

            </thead>


            <tbody id="expenseTable">

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>



<script>

  let allExpenses = [];



  document.addEventListener("DOMContentLoaded", function() {

    document.getElementById("date").value =
      new Date().toISOString().split("T")[0];

    loadData();

  });



  function showLoading() {
    document.getElementById("loading").style.display = "flex";
  }

  function hideLoading() {
    document.getElementById("loading").style.display = "none";
  }



  function loadData() {

    showLoading();

    google.script.run
      .withSuccessHandler(function(data) {

        allExpenses = data;

        displayExpenses(data);

        loadDashboard();

        hideLoading();

      })
      .withFailureHandler(function(error) {

        hideLoading();

        alert(error.message);

      })
      .getExpenses();

  }



  function loadDashboard() {

    google.script.run
      .withSuccessHandler(function(data) {

        document.getElementById("total").textContent =
          formatMoney(data.total);

        document.getElementById("today").textContent =
          formatMoney(data.today);

        document.getElementById("count").textContent =
          data.count;

        document.getElementById("average").textContent =
          formatMoney(data.average);

      })
      .getDashboardData();

  }



  function addExpense() {

    const description =
      document.getElementById("description").value.trim();

    const category =
      document.getElementById("category").value;

    const amount =
      document.getElementById("amount").value;

    const date =
      document.getElementById("date").value;


    if (!description || !category || !amount || !date) {

      alert("Please complete all fields.");

      return;

    }


    showLoading();


    google.script.run
      .withSuccessHandler(function(response) {

        alert(response.message);

        document.getElementById("description").value = "";

        document.getElementById("category").value = "";

        document.getElementById("amount").value = "";

        loadData();

      })
      .withFailureHandler(function(error) {

        hideLoading();

        alert(error.message);

      })
      .addExpense(
        description,
        category,
        amount,
        date
      );

  }



  function displayExpenses(data) {

    const table =
      document.getElementById("expenseTable");

    table.innerHTML = "";


    if (data.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="5">
            <div class="empty">
              <div style="font-size:35px;">
                🧾
              </div>

              <p>
                No expenses yet.
              </p>

              <small>
                Add your first expense.
              </small>
            </div>
          </td>
        </tr>
      `;

      return;

    }


    data.forEach(function(expense) {

      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          <strong>
            ${escapeHTML(expense.description)}
          </strong>
        </td>

        <td>
          <span class="category">
            ${escapeHTML(expense.category)}
          </span>
        </td>

        <td>
          <span class="amount">
            ${formatMoney(expense.amount)}
          </span>
        </td>

        <td>
          ${expense.date}
        </td>

        <td>

          <button
            class="delete-btn"
            onclick="deleteExpense('${expense.id}')"
          >
            🗑️
          </button>

        </td>

      `;


      table.appendChild(row);

    });

  }



  function deleteExpense(id) {

    if (!confirm("Delete this expense?")) {
      return;
    }


    showLoading();


    google.script.run
      .withSuccessHandler(function(response) {

        alert(response.message);

        loadData();

      })
      .withFailureHandler(function(error) {

        hideLoading();

        alert(error.message);

      })
      .deleteExpense(id);

  }



  function searchExpenses() {

    const keyword =
      document.getElementById("search")
        .value
        .toLowerCase();


    const filtered =
      allExpenses.filter(function(expense) {

        return (

          expense.description
            .toLowerCase()
            .includes(keyword)

          ||

          expense.category
            .toLowerCase()
            .includes(keyword)

        );

      });


    displayExpenses(filtered);

  }


  function formatMoney(amount) {

    return "₱" +
      Number(amount || 0)
        .toLocaleString("en-PH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

  }



  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }



  function focusExpenseForm() {

    document
      .getElementById("expenseForm")
      .scrollIntoView({
        behavior: "smooth"
      });

    document
      .getElementById("description")
      .focus();

  }


  function scrollToExpenses() {

    document
      .getElementById("expensesPanel")
      .scrollIntoView({
        behavior: "smooth"
      });

  }

</script>


</body>

</html>
