<!DOCTYPE html>
<html>

<head>

<base target="_top">

  <style>

body{

font-family:Arial;
background:#f4f4f4;
margin:0;
padding:30px;

}

.container{

max-width:1000px;
margin:auto;

}

.card{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);

display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;

}

.card input,
.card select{

padding:10px;
font-size:15px;

}

button{

background:#4CAF50;
color:white;
border:none;
padding:10px;
cursor:pointer;

}

button:hover{

background:#2E7D32;

}

.summary{

display:flex;
gap:20px;
margin-top:20px;

}

.box{

flex:1;
background:white;
padding:20px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);

}

table{

margin-top:30px;
width:100%;
background:white;
border-collapse:collapse;

}

th{

background:#4CAF50;
color:white;

}

td,th{

padding:12px;
border:1px solid #ddd;

}

.delete{

background:red;

}

</style>

</head>

<body>

<div class="container">

<h1>Expense Tracker</h1>

<div class="card">

<input type="date" id="date">

<select id="category">

<option>Food</option>
<option>Transportation</option>
<option>Shopping</option>
<option>Education</option>
<option>Others</option>

</select>

<input
type="text"
id="description"
placeholder="Description">

<input
type="number"
id="amount"
placeholder="Amount">

<button onclick="saveExpense()">
Add Expense
</button>

</div>

<div class="summary">

<div class="box">

<h2>Total Expenses</h2>

<h3 id="total">₱0</h3>

</div>

<div class="box">

<h2>Today's Expense</h2>

<h3 id="today">₱0</h3>

</div>

</div>

<table>

<thead>

<tr>

<th>Date</th>
<th>Category</th>
<th>Description</th>
<th>Amount</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="expenseTable">

</tbody>

</table>

</div>

<script>

window.onload=function(){

document.getElementById("date").valueAsDate=new Date();

loadExpenses();

loadDashboard();

}

function saveExpense(){

let data={

date:document.getElementById("date").value,

category:document.getElementById("category").value,

description:document.getElementById("description").value,

amount:document.getElementById("amount").value

};

google.script.run
.withSuccessHandler(function(){

loadExpenses();

loadDashboard();

document.getElementById("description").value="";
document.getElementById("amount").value="";

})
.addExpense(data);

}

function loadExpenses() {

  google.script.run
    .withSuccessHandler(function(data) {
      showExpenses(data);
    })
    .getExpenses();
}

function showExpenses(data) {

  const tbody = document.getElementById("expenseTable");

  tbody.innerHTML = "";

  data.forEach(function(row, index) {

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row[0]}</td>
      <td>${row[1]}</td>
      <td>${row[2]}</td>
      <td>₱${row[3]}</td>
      <td>
        <button class="delete" onclick="removeExpense(${index})">
          Delete
        </button>
      </td>
    `;

    tbody.appendChild(tr);

  });

}
function removeExpense(row){

google.script.run
.withSuccessHandler(function(){

loadExpenses();

loadDashboard();

})
.deleteExpense(row);

}

function loadDashboard(){

google.script.run
.withSuccessHandler(function(data){

document.getElementById("total").innerHTML="₱"+data.total;

document.getElementById("today").innerHTML="₱"+data.today;

})
.dashboardData();

}

</script>
</body>
</html>
